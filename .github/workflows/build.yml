name: Build Kernel & Push to Cachix

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Nix (Official Upstream)
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: cachyoskernel-bbr3-v3
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Update flake inputs (on schedule)
        if: github.event_name == 'schedule'
        run: |
          nix flake update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump kernel flake inputs" || exit 0
          git push

      - name: Build CachyOS BBRv3 Kernel
        run: |
          nix build .#kernel --print-build-logs
      - name: Package for Generic Linux
        run: |
          sudo apt-get update && sudo apt-get install -y zstd

          KERNEL_OUT=$(readlink -f result)
          KVER=$(ls "${KERNEL_OUT}/lib/modules")
          echo "KVER=${KVER}" >> $GITHUB_ENV

          PKG_NAME="linux-cachyos-server-bbr3-${KVER}-x86_64-v3"
          mkdir -p "${PKG_NAME}"

          cp "${KERNEL_OUT}/bzImage" "${PKG_NAME}/"
          [ -f "${KERNEL_OUT}/System.map" ] && cp "${KERNEL_OUT}/System.map" "${PKG_NAME}/"

          mkdir -p "${PKG_NAME}/modules"
          cp -rf "${KERNEL_OUT}/lib/modules/${KVER}/"* "${PKG_NAME}/modules/"

          echo "${KVER}" > "${PKG_NAME}/kver"
          cp install.sh "${PKG_NAME}/"
          chmod +x "${PKG_NAME}/install.sh"

          tar --zstd -cf "${PKG_NAME}.tar.zst" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.zst" > "${PKG_NAME}.tar.zst.sha256"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${KVER}"
          RELEASE_TITLE="Linux CachyOS Server Kernel v${KVER} with BBRv3 & x86-64-v3"

          cat << 'EOF' > release_notes.md
          ### Documentation
          * 📖 [English Documentation](https://github.com/lazyeel/cachyoskernel-bbr3-v3/blob/main/README.md)
          * 📖 [Русская документация](https://github.com/lazyeel/cachyoskernel-bbr3-v3/blob/main/README_RU.md)

          ---

          ### Quick Install for Generic Linux (Debian, Ubuntu, Arch, Fedora):
          ```bash
          tar --zstd -xf linux-cachyos-server-bbr3-*.tar.zst
          cd linux-cachyos-server-bbr3-*
          sudo ./install.sh
          ```
          EOF

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists. Uploading new assets..."
            gh release upload "${TAG_NAME}" linux-cachyos-server-bbr3-*.tar.zst* --clobber
          else
            echo "Creating new release ${TAG_NAME}..."
            gh release create "${TAG_NAME}" linux-cachyos-server-bbr3-*.tar.zst* \
              --title "${RELEASE_TITLE}" \
              --notes-file release_notes.md
          fi
